<div id="warehouseMenuRoot"></div>
<script>
// 仓库清单
const warehouseList = [
  {id:"ware-A", displayName:"A总仓"},
  {id:"ware-M", displayName:"M总仓"},
  {id:"ware-B", displayName:"B总仓"},
  {id:"ware-O", displayName:"O总仓"},
  {id:"ware-F", displayName:"F总仓"},
];
// 物流商清单
const logisticsList = [
  {id:"dhl", name:"DHL"},
  {id:"dx", name:"DX"},
  {id:"evri", name:"Evri"},
  {id:"extra", name:"Extra"},
  {id:"fedex", name:"Fedex"},
  {id:"royalmail(菜鸟)", name:"Royal Mail"},
  {id:"sd", name:"SD"},
  {id:"yodel", name:"Yodel"},
];
// 月份清单
const monthList = [
  {name:"8月", folder:"warehouse_report_august", suffix:"_August"},
  {name:"9月", folder:"warehouse_report_september", suffix:"_September"},
  {name:"10月", folder:"warehouse_report_october", suffix:"_October"},
];

function renderWarehouseMenu(){
  let html = "";
  html += `<div class="item" onclick="toggleMenu('menuwarehouse')">🏬 各英仓报表</div>`;
  html += `<div class="submenu" id="menuwarehouse">`;

  warehouseList.forEach(ware=>{
    const wareMenuId = `menu_${ware.id}`;
    html += `<div class="item" onclick="toggleMenu('${wareMenuId}')">📦 ${ware.displayName}</div>`;
    html += `<div class="submenu" id="${wareMenuId}">`;

    // 遍历月份
    monthList.forEach(m=>{
      const monthMenuId = `menu_${ware.id}_${m.folder}`;
      html += `<div class="item" onclick="toggleMenu('${monthMenuId}')">🗓️ ${m.name}</div>`;
      html += `<div class="submenu" id="${monthMenuId}">`;

      // 遍历物流商，自动生成链接
      logisticsList.forEach(logi=>{
        // 文件名：A总仓-dhl_October_weekly.html
        const fileName = `${ware.displayName}-${logi.id}${m.suffix}.html`;
        const url = `${m.folder}/${ware.id}/${fileName}`;
        html += `<a class="sub-item" href="${url}" target="_blank">${logi.name}</a>`;
      })
      html += `</div>`;
    })
    html += `</div>`;
  })
  html += `</div>`;
  document.getElementById("warehouseMenuRoot").innerHTML = html;
}
renderWarehouseMenu();
</script>
