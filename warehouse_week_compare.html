<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仓库+物流商+周 多条件横向对比</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei,sans-serif;}
body{background:#edf2f9;padding:40px 20px;max-width:1600px;margin:0 auto;}
h1{text-align:center;color:#1e293b;margin-bottom:32px;font-size:28px;font-weight:600;}
.header-row{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:32px;}
.header-row h1{margin:0;}
a.back-home{display:inline-block;padding:10px 20px;background:#2563eb;color:#fff;text-decoration:none;border-radius:8px;white-space:nowrap;}

.wrap{display:flex;gap:32px;align-items:flex-start;margin-bottom:30px;}
.left-panel, .right-panel{
    flex:1;
    background:#ffffff;
    padding:24px;
    border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.section{margin-bottom:20px;}
h3{font-size:20px;color:#1e293b;margin-bottom:16px;}
h4{font-size:16px;color:#475569;margin:10px 0 12px;}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.filter-btn{
    padding:8px 14px;border:1px solid #cbd5e1;background:#fff;border-radius:6px;
    cursor:pointer;font-size:14px;transition:all 0.2s;
}
.filter-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;}
.filter-btn:hover{border-color:#2563eb;}

#tip{margin-bottom:16px;color:#333;font-size:15px;}
.iframe-container{
    display:flex;gap:20px;width:100%;position:sticky;top:10px;
}
.iframe-wrap{
    flex:1;height:calc(100vh - 20px);overflow:hidden;border:1px solid #e2e8f0;border-radius:8px;background:#fff;
}
.iframe-title{
    padding:10px 16px;background:#2563eb;color:#fff;font-weight:500;
}
.iframe-wrap iframe{width:100%;height:calc(100% - 44px);border:none;overflow:auto;}

@media(max-width:1024px){
    .wrap{flex-direction:column;}
    .iframe-container{flex-direction:column;top:5px;}
    .iframe-wrap{height:calc(80vh - 10px);}
}
</style>
</head>
<body>
<div class="header-row">
  <a href="index.html" class="back-home">← 返回首页</a>
  <h1>📊 仓库+物流商+周 多条件横向对比</h1>
</div>

<!-- 左右选择面板 -->
<div class="wrap">
    <div class="left-panel">
        <h3>对比项 A</h3>
        <div class="section">
            <h4>选择仓库</h4>
            <div class="btn-group" id="groupA_ware">
                <button class="filter-btn" data-val="A总仓" data-folder="warehouses_all_weekly">A总仓</button>
                <button class="filter-btn" data-val="M总仓" data-folder="warehouses_all_weekly">M总仓</button>
                <button class="filter-btn" data-val="B总仓" data-folder="warehouses_all_weekly">B总仓</button>
                <button class="filter-btn" data-val="O总仓" data-folder="warehouses_all_weekly">O总仓</button>
                <button class="filter-btn" data-val="F总仓" data-folder="warehouses_all_weekly">F总仓</button>
            </div>
        </div>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupA_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">royalmail(菜鸟)</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">yodel(菜鸟)</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择周报表</h4>
            <div class="btn-group" id="groupA_week">
                <button class="filter-btn" data-val="10月周报表" data-suffix="_October_weekly">10月周报表</button>
                <button class="filter-btn" data-val="9月周报表" data-suffix="_September_weekly">9月周报表</button>
                <button class="filter-btn" data-val="8月周报表" data-suffix="_August_weekly">8月周报表</button>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <h3>对比项 B</h3>
        <div class="section">
            <h4>选择仓库</h4>
            <div class="btn-group" id="groupB_ware">
                <button class="filter-btn" data-val="A总仓" data-folder="warehouses_all_weekly">A总仓</button>
                <button class="filter-btn" data-val="M总仓" data-folder="warehouses_all_weekly">M总仓</button>
                <button class="filter-btn" data-val="B总仓" data-folder="warehouses_all_weekly">B总仓</button>
                <button class="filter-btn" data-val="O总仓" data-folder="warehouses_all_weekly">O总仓</button>
                <button class="filter-btn" data-val="F总仓" data-folder="warehouses_all_weekly">F总仓</button>
            </div>
        </div>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupB_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">royalmail(菜鸟)</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">yodel(菜鸟)</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择周报表</h4>
            <div class="btn-group" id="groupB_week">
                <button class="filter-btn" data-val="10月周报表" data-suffix="_October_weekly">10月周报表</button>
                <button class="filter-btn" data-val="9月周报表" data-suffix="_September_weekly">9月周报表</button>
                <button class="filter-btn" data-val="8月周报表" data-suffix="_August_weekly">8月周报表</button>
            </div>
        </div>
    </div>
</div>

<div id="tip"></div>
<!-- 404备注提示，仅iframe加载后出现 -->
<div style="color:#64748b;font-size:14px;margin-bottom:16px;">
如选择后页面出现404，代表该仓库+物流商+当周无对应数据（可查看原始按月导出的物流数据核查）
</div>

<!-- iframe容器，带标题栏 -->
<div class="iframe-container">
    <div class="iframe-wrap">
        <div class="iframe-title" id="titleA"></div>
        <iframe id="iframeA"></iframe>
    </div>
    <div class="iframe-wrap">
        <div class="iframe-title" id="titleB"></div>
        <iframe id="iframeB"></iframe>
    </div>
</div>

<script>
// 存储A、B两组选中项
let A = {ware:null, wareFolder:null, logi:null, week:null, weekSuffix:null};
let B = {ware:null, wareFolder:null, logi:null, week:null, weekSuffix:null};

// 通用绑定函数
function bindGroup(btnGroupId, targetObj, keyName, extraKey=null){
    const btns = document.querySelectorAll(`#${btnGroupId} .filter-btn`);
    btns.forEach(btn=>{
        btn.onclick = ()=>{
            btns.forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            targetObj[keyName] = btn.dataset.val;
            if(extraKey){
                targetObj[extraKey] = btn.dataset[extraKey];
            }
            refreshStatus();
        }
    })
}

// 绑定所有按钮组
bindGroup("groupA_ware", A, "ware", "wareFolder");
bindGroup("groupA_logi", A, "logi");
bindGroup("groupA_week", A, "week", "weekSuffix");

bindGroup("groupB_ware", B, "ware", "wareFolder");
bindGroup("groupB_logi", B, "logi");
bindGroup("groupB_week", B, "week", "weekSuffix");

function refreshStatus(){
    const tip = document.getElementById("tip");
    const titleA = document.getElementById("titleA");
    const titleB = document.getElementById("titleB");
    const iframeA = document.getElementById("iframeA");
    const iframeB = document.getElementById("iframeB");

    // A组
    let textA = "";
    if(A.ware && A.logi && A.week){
        textA = `${A.ware}｜${A.logi}｜${A.week}`;
        titleA.innerText = textA;
        const urlA = `${A.wareFolder}/${A.logi}${A.weekSuffix}.html`;
        iframeA.src = urlA;
    }else{
        textA = "待选择仓库+物流+周";
        titleA.innerText = "";
        iframeA.src = "";
    }

    // B组
    let textB = "";
    if(B.ware && B.logi && B.week){
        textB = `${B.ware}｜${B.logi}｜${B.week}`;
        titleB.innerText = textB;
        const urlB = `${B.wareFolder}/${B.logi}${B.weekSuffix}.html`;
        iframeB.src = urlB;
    }else{
        textB = "待选择仓库+物流+周";
        titleB.innerText = "";
        iframeB.src = "";
    }

    // 保留你原来这行
    const text = `A:${textA}｜B:${textB}`;
    tip.innerText = text;
}
</script>
</body>
</html>
