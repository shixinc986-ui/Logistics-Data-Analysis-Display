<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物流商月份双对比看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei,sans-serif;}
body{background:#edf2f9;padding:40px 20px;max-width:1600px;margin:0 auto;}
h1{text-align:center;color:#1e293b;margin-bottom:32px;font-size:28px;font-weight:600;}
.wrap{display:flex;gap:32px;align-items:flex-start;margin-bottom:30px;}
.left-panel, .right-panel{
    flex:1;
    background:#ffffff;
    padding:24px;
    border-radius:14px;
    box-shadow:0 4px 16px rgba(15, 23, 42, 0.08);
}
h3{margin-bottom:18px;color:#0f172a;font-size:20px;}
h4{margin-bottom:12px;color:#475569;font-size:16px;font-weight:500;}
.section{margin-bottom:22px;}
.btn-group{display:flex;flex-wrap:wrap;gap:10px;}
.filter-btn{
    padding:8px 12px;
    border:1px solid #cbd5e1;
    background:#fff;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    transition:0.2s all ease;
}
.filter-btn:hover{
    border-color:#60a5fa;
}
.filter-btn.active{
    background:#2563eb;
    color:white;
    border:#2563eb;
    box-shadow:0 2px 6px #2563eb40;
}
.jump-area{margin-bottom:24px;text-align:center;}
#tipText{
    font-size:17px;
    color:#334155;
    margin-bottom:16px;
}
#loadCompareBtn{
    padding:14px 36px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
    transition:0.2s;
    box-shadow:0 3px 10px #2563eb33;
}
#loadCompareBtn:hover:not(:disabled){
    background:#1d4ed8;
}
#loadCompareBtn:disabled{
    background:#94a3b8;
    cursor:not-allowed;
    box-shadow:none;
}
/* 双报表iframe容器 */
.iframe-container{
    display:flex;
    gap:20px;
    width:100%;
}
.iframe-wrap{
    flex:1;
}
.iframe-wrap h4{
    text-align:center;margin-bottom:8px;
}
iframe{
    width:100%;
    height:900px;
    border:1px solid #cbd5e1;
    border-radius:10px;
    background:#fff;
}
@media(max-width:1024px){
    .wrap{flex-direction:column;}
    .iframe-container{flex-direction:column;}
}
</style>
</head>
<body>
<h1>📊 物流商月份双对比看板</h1>
<!-- 选择区域 -->
<div class="wrap">
    <div class="left-panel">
        <h3>对比项 A</h3>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupA_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">RM</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">YODEL</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
                <button class="filter-btn" data-val="XDP">XDP</button>
                <button class="filter-btn" data-val="DX">DX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择月份</h4>
            <div class="btn-group" id="groupA_month">
                <button class="filter-btn" data-val="August">8月</button>
                <button class="filter-btn" data-val="July">7月</button>
            </div>
        </div>
    </div>
    <div class="right-panel">
        <h3>对比项 B</h3>
        <div class="section">
            <h4>选择物流商</h4>
            <div class="btn-group" id="groupB_logi">
                <button class="filter-btn" data-val="DHL">DHL</button>
                <button class="filter-btn" data-val="EVRI">EVRI</button>
                <button class="filter-btn" data-val="royalmail(菜鸟)">RM</button>
                <button class="filter-btn" data-val="yodel(菜鸟)">YODEL</button>
                <button class="filter-btn" data-val="SD">SD</button>
                <button class="filter-btn" data-val="FEDEX">FEDEX</button>
                <button class="filter-btn" data-val="XDP">XDP</button>
                <button class="filter-btn" data-val="DX">DX</button>
            </div>
        </div>
        <div class="section">
            <h4>选择月份</h4>
            <div class="btn-group" id="groupB_month">
                <button class="filter-btn" data-val="August">8月</button>
            
            </div>
        </div>
    </div>
</div>

<div class="jump-area">
    <p id="tipText">请分别在左右两侧选择【物流商+月份】</p>
    <button id="loadCompareBtn" disabled>🔍 加载双报表同屏对比</button>
</div>

<!-- 左右并排iframe容器，报表在这里展示 -->
<div class="iframe-container">
    <div class="iframe-wrap">
        <h4 id="titleA">报表A</h4>
        <iframe id="iframeA"></iframe>
    </div>
    <div class="iframe-wrap">
        <h4 id="titleB">报表B</h4>
        <iframe id="iframeB"></iframe>
    </div>
</div>

<script>
let A = {logi:null, month:null};
let B = {logi:null, month:null};

function bindGroup(btnGroupId, targetObj, keyName){
    const btns = document.querySelectorAll(`#${btnGroupId} .filter-btn`);
    btns.forEach(btn=>{
        btn.onclick = ()=>{
            btns.forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            targetObj[keyName] = btn.dataset.val;
            refreshStatus();
        }
    })
}
bindGroup("groupA_logi", A, "logi");
bindGroup("groupA_month", A, "month");
bindGroup("groupB_logi", B, "logi");
bindGroup("groupB_month", B, "month");

function refreshStatus(){
    const tip = document.getElementById("tipText");
    const loadBtn = document.getElementById("loadCompareBtn");
    if(A.logi && A.month && B.logi && B.month){
        tip.innerText = `A:${A.logi}-${A.month}｜B:${B.logi}-${B.month}`;
        loadBtn.disabled = false;
    }else{
        tip.innerText = "请分别在左右两侧选择【物流商+月份】";
        loadBtn.disabled = true;
    }
}

document.getElementById("loadCompareBtn").onclick = function(){
    const validList = ["dhl","evri","royalmail(菜鸟)","yodel(菜鸟)","sd","fedex","xdp","dx","extra_large_parcel_courier"];
    let logiA = A.logi.toLowerCase();
    let logiB = B.logi.toLowerCase();
    if(!validList.includes(logiA) || !validList.includes(logiB)){
        alert("所选物流商没有对应的报表，请重新选择");
        return;
    }
    // 文件路径：后续你需要带上月份就改成 `${logiA}-${A.month}.html`
    // monthVal 从下拉框获取："August" / "July"
    const folderName = `provides_report_${monthVal}`;
    const fileA = `${folderName}/${logiA}_${monthVal}.html`;
    const fileB = `${folderName}/${logiB}_${monthVal}.html`;

    // 给iframe赋值，加载报表
    document.getElementById("iframeA").src = fileA;
    document.getElementById("iframeB").src = fileB;
    document.getElementById("titleA").innerText = `A：${A.logi} - ${A.month}`;
    document.getElementById("titleB").innerText = `B：${B.logi} - ${B.month}`;
}
</script>
</body>
</html>
