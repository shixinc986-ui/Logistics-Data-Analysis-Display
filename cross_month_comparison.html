<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨月横向对比 - 物流报表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei,sans-serif;}
body{background:#f5f7fa;padding:24px;}
h1{text-align:center;color:#1e293b;margin-bottom:24px;font-size:24px;}
.select-wrap{display:flex;gap:30px;justify-content:center;margin-bottom:24px;flex-wrap:wrap;align-items:center;}
.select-item{display:flex;gap:10px;align-items:center;}
label{font-size:16px;font-weight:500;color:#333;}
select{padding:8px 14px;font-size:16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;}
.container{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:calc(100vh - 200px);}
.iframe-box{border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #00000015;border:1px solid #e2e8f0;}
iframe{width:100%;height:100%;border:0;}
.back{display:block;width:fit-content;margin:16px auto 0;padding:10px 24px;background:#2563eb;color:#fff;border-radius:8px;text-decoration:none;text-align:center;transition:0.2s;}
.back:hover{background:#1d4ed8;}
</style>
</head>
<body>
<h1>📊 跨月横向对比</h1>
<div class="select-wrap">
  <div class="select-item">
    <label>左侧月份：</label>
    <select id="selLeft">
      <option value="monthly_7.html">7月</option>
      <option value="monthly_8.html" selected>8月</option>
    </select>
  </div>
  <div class="select-item">
    <label>右侧月份：</label>
    <select id="selRight">
      <option value="monthly_7.html" selected>7月</option>
      <option value="monthly_8.html">8月</option>
    </select>
  </div>
</div>
<div class="container">
  <div class="iframe-box">
    <iframe id="frameLeft" src="monthly_8.html"></iframe>
  </div>
  <div class="iframe-box">
    <iframe id="frameRight" src="monthly_7.html"></iframe>
  </div>
</div>
<a class="back" href="../index.html">← 返回首页</a>

<script>
const selLeft = document.getElementById("selLeft");
const selRight = document.getElementById("selRight");
const frameLeft = document.getElementById("frameLeft");
const frameRight = document.getElementById("frameRight");

selLeft.onchange = ()=>{
  frameLeft.src = selLeft.value;
}
selRight.onchange = ()=>{
  frameRight.src = selRight.value;
}
</script>
</body>
</html>
