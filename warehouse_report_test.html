<!-- ============================================================================
  英仓报表前端（对接新版 JSON：三套口径 raw / non_neg / valid）
  改动点：
    1. 筛选条「重置」右侧新增「查询」按钮（点击触发 render）
    2. 7 类包裹状态汇总表底部新增「总计」行（总数 + 100.00%）
    3. ver1/ver2 → raw_*；ver3/ver4 → non_neg_*；ver5/ver6 → valid_*
       每套：Ascan/Dscan/Total 的 平均/最大/最小 + 24h揽收率 + 准时签收率
  说明：本文件为可直接保存为 .html 的完整代码，粘贴到 warehouse_report_test.html 覆盖即可
============================================================================= -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筛选条件（测试）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Microsoft YaHei,sans-serif;}
  body{background:#f5f7fa;padding:24px 20px;color:#1e293b;}
  .wrap{max-width:1080px;margin:0 auto;}
  h1{font-size:20px;font-weight:600;margin-bottom:16px;}

  /* ===== 顶部筛选条 ===== */
  .filter-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
  .filter-item{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#475569;}
  .filter-item label{font-weight:600;}
  select{padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;background:#fff;min-width:170px;}
  select:focus{outline:none;border-color:#2563eb;}
  .btn-reset{margin-top:18px;padding:8px 16px;border:1px solid #2563eb;border-radius:8px;background:#fff;color:#2563eb;cursor:pointer;font-size:14px;}
  .btn-reset:hover{background:#eff6ff;}
  .btn-query{margin-top:18px;padding:8px 16px;border:1px solid #2563eb;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer;font-size:14px;}
  .btn-query:hover{background:#1d4ed8;}

  /* ===== 条件摘要 ===== */
  .meta{font-size:13px;color:#475569;margin-bottom:12px;}
  .meta strong{color:#1e293b;}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;}

  /* ===== 结果卡片 ===== */
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px 18px;margin-bottom:16px;}
  .card h2{font-size:15px;font-weight:600;margin-bottom:10px;}
  table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:13px;}
  th,td{border:1px solid #e2e8f0;padding:8px 10px;text-align:left;word-wrap:break-word;}
  th{background:#f1f5f9;color:#334155;}
  td.num,th.num{text-align:right;}
  .ver-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:860px){.ver-grid{grid-template-columns:1fr;}}
  .empty{padding:40px;text-align:center;color:#94a3b8;font-size:14px;}
  tr.total-row{background:#e5e7eb;font-weight:bold;}
</style>
</head>
<body>
<div class="wrap">
  <h1>筛选测试页</h1>

  <!-- ===== 筛选条：周 → 物流商 → 仓库 → 班次；重置 + 查询 ===== -->
  <div class="filter-bar">
    <div class="filter-item">
      <label for="selWeek">周</label>
      <select id="selWeek"></select>
    </div>
    <div class="filter-item">
      <label for="selProvider">物流商</label>
      <select id="selProvider"></select>
    </div>
    <div class="filter-item">
      <label for="selWarehouse">仓库</label>
      <select id="selWarehouse"></select>
    </div>
    <div class="filter-item">
      <label for="selShift">早间 / 午间单</label>
      <select id="selShift"></select>
    </div>
    <button class="btn-reset" id="btnReset">重置</button>
  </div>

  <div class="meta" id="meta"></div>
  <div id="result"></div>
</div>

<script>
/* ================= 常量（按现有 JSON 取值） ================= */
const DATA_URL = "warehouse_data_2026.json";

const WAREHOUSE_NAME = { A:"A总仓", B:"B总仓", F:"F总仓", M:"M总仓", O:"O总仓", "3rd":"第三方仓" };
const SHIFT_NAME = { morning:"早间单", noon:"午间单" };
// 周标签不再硬编码，由 JSON 的 week_label/week_range 动态生成，避免周次错位
let WEEK_MAP = {};

/* 六版本 → 三套口径(raw/non_neg/valid) × 两套样本(a:常规+超时 / b:常规+超时+异常+无轨迹) */
const VER_GROUPS = [
  { key:"ver1", prefix:"raw",     sample:"a", title:"ver1 · A版（常规+超时）" },
  { key:"ver2", prefix:"raw",     sample:"b", title:"ver2 · B版（常规+超时+异常+无轨迹）" },
  { key:"ver3", prefix:"non_neg", sample:"a", title:"ver3 · 剔除负数 A版（常规+超时）" },
  { key:"ver4", prefix:"non_neg", sample:"b", title:"ver4 · 剔除负数 B版（常规+超时+异常+无轨迹）" },
  { key:"ver5", prefix:"valid",   sample:"a", title:"ver5 · 剔除负数、无轨迹异常 A版（常规+超时）" },
  { key:"ver6", prefix:"valid",   sample:"b", title:"ver6 · 剔除负数、无轨迹异常 B版（常规+超时+异常）" }
];

let ALL_ROWS = [];

/* ================= 数值/格式化工具 ================= */
function num(v){
  if(v == null) return 0;
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}
function fmtInt(n){ return Math.round(n).toLocaleString("en-US"); }
// 平均值：分母为 0 显示 —
function avgStr(cnt, sum){
  if(!cnt || cnt <= 0) return "—";
  return (sum / cnt).toFixed(2);
}
// 极值：无样本显示 —
function extStr(has, v){ return has ? v.toFixed(2) : "—"; }
// 百分比：分母为 0 显示 —
function pctStr(numer, denom){
  if(!denom || denom <= 0) return "—";
  return (numer / denom * 100).toFixed(2) + "%";
}

/* ================= 下拉填充 ================= */
function uniqueSorted(rows, field){
  const set = new Set(rows.map(r => r[field]).filter(Boolean));
  return [...set].sort();
}
function fillSelect(sel, values, labelFn, firstLabel){
  sel.innerHTML = `<option value="">${firstLabel}</option>` +
    values.map(v => `<option value="${v}">${labelFn(v)}</option>`).join("");
}
function getFilters(){
  return {
    week: document.getElementById("selWeek").value,
    provider: document.getElementById("selProvider").value,
    warehouse: document.getElementById("selWarehouse").value,
    shift: document.getElementById("selShift").value
  };
}
function matches(row, f){
  if(f.week && row.week_id !== f.week) return false;
  if(f.provider && row.provider !== f.provider) return false;
  if(f.warehouse && row.warehouse !== f.warehouse) return false;
  if(f.shift && row.shift !== f.shift) return false;
  return true;
}

/* ================= 聚合：三套口径 + 7 分类 =================
   计数/求和/分子分母 → 累加；max → 全局最大；min → 全局最小 */
function aggregate(rows){
  const stat = {
    raw_total: 0,
    normal: 0, pick_overtime: 0, deliver_overtime: 0, both_overtime: 0,
    pick_stagnant: 0, pick_stagnant_full: 0, no_track: 0,
    buckets: {}
  };
  VER_GROUPS.forEach(g => {
    stat.buckets[g.prefix + "_" + g.sample] = makeBucket();
  });

  rows.forEach(r => {
    stat.raw_total += num(r.raw_total);
    stat.normal            += num(r.cnt_normal);
    stat.pick_overtime     += num(r.cnt_pick_overtime);
    stat.deliver_overtime  += num(r.cnt_deliver_overtime);
    stat.both_overtime     += num(r.cnt_both_overtime);
    stat.pick_stagnant     += num(r.cnt_pick_stagnant);
    stat.pick_stagnant_full+= num(r.cnt_pick_stagnant_full);
    stat.no_track          += num(r.cnt_no_track);

    VER_GROUPS.forEach(g => {
      collect(stat.buckets[g.prefix + "_" + g.sample], r, g.prefix + "_" + g.sample);
    });
  });
  return stat;
}

function makeBucket(){
  return {
    cnt_Ascan:0, sum_Ascan:0, max_Ascan:-Infinity, min_Ascan:Infinity,
    cnt_Dscan:0, sum_Dscan:0, max_Dscan:-Infinity, min_Dscan:Infinity,
    cnt_Total:0, sum_Total:0, max_Total:-Infinity, min_Total:Infinity,
    picked_24h_cnt:0, ontime_cnt:0, ontime_denom:0
  };
}

function collect(b, r, p){
  // Ascan
  const cA = num(r[p+"_cnt_Ascan"]);
  b.cnt_Ascan += cA;
  b.sum_Ascan += num(r[p+"_sum_Ascan_leadtime"]);
  if(cA > 0){
    b.max_Ascan = Math.max(b.max_Ascan, num(r[p+"_max_Ascan"]));
    b.min_Ascan = Math.min(b.min_Ascan, num(r[p+"_min_Ascan"]));
  }
  // Dscan
  const cD = num(r[p+"_cnt_Dscan"]);
  b.cnt_Dscan += cD;
  b.sum_Dscan += num(r[p+"_sum_Dscan_leadtime"]);
  if(cD > 0){
    b.max_Dscan = Math.max(b.max_Dscan, num(r[p+"_max_Dscan"]));
    b.min_Dscan = Math.min(b.min_Dscan, num(r[p+"_min_Dscan"]));
  }
  // Total
  const cT = num(r[p+"_cnt_Total"]);
  b.cnt_Total += cT;
  b.sum_Total += num(r[p+"_sum_Total_leadtime"]);
  if(cT > 0){
    b.max_Total = Math.max(b.max_Total, num(r[p+"_max_Total"]));
    b.min_Total = Math.min(b.min_Total, num(r[p+"_min_Total"]));
  }

  b.picked_24h_cnt += num(r[p+"_picked_24h_cnt"]);
  b.ontime_cnt      += num(r[p+"_ontime_cnt"]);
  b.ontime_denom    += num(r[p+"_ontime_denom"]);
}

/* ================= 组装某一套口径的展示对象 ================= */
function buildView(b){
  const hasA = b.cnt_Ascan > 0, hasD = b.cnt_Dscan > 0, hasT = b.cnt_Total > 0;
  return {
    Ascan_avg:  avgStr(b.cnt_Ascan, b.sum_Ascan),
    Ascan_max:  extStr(hasA, b.max_Ascan),
    Ascan_min:  extStr(hasA, b.min_Ascan),
    Dscan_avg:  avgStr(b.cnt_Dscan, b.sum_Dscan),
    Dscan_max:  extStr(hasD, b.max_Dscan),
    Dscan_min:  extStr(hasD, b.min_Dscan),
    Total_avg:  avgStr(b.cnt_Total, b.sum_Total),
    Total_max:  extStr(hasT, b.max_Total),
    Total_min:  extStr(hasT, b.min_Total),
    rate24:     pctStr(b.picked_24h_cnt, b.cnt_Ascan),
    rateOntime: pctStr(b.ontime_cnt, b.ontime_denom)
  };
}

/* ================= 渲染 ================= */
function baseTableHTML(stat){
  const pct = cnt => stat.raw_total > 0 ? pctStr(cnt, stat.raw_total) : "—";
  const rows = [
    { label:"1. 常规",               count:stat.normal },
    { label:"2. 揽件时效超时",       count:stat.pick_overtime },
    { label:"3. 送达时效超时",       count:stat.deliver_overtime },
    { label:"4. 揽件和送达均超时",   count:stat.both_overtime },
    { label:"5. 揽件后停滞异常",     count:stat.pick_stagnant },
    { label:"6. 揽件后停滞【全】异常",count:stat.pick_stagnant_full },
    { label:"7. 无轨迹异常",         count:stat.no_track }
  ];
  return `<table>
    <colgroup><col style="width:46%"><col style="width:27%"><col style="width:27%"></colgroup>
    <thead><tr><th>分类</th><th class="num">数量</th><th class="num">占比</th></tr></thead>
    <tbody>
      ${rows.map(r => `<tr><td>${r.label}</td><td class="num">${fmtInt(r.count)}</td><td class="num">${pct(r.count)}</td></tr>`).join("")}
      <tr class="total-row"><td>总计</td><td class="num">${fmtInt(stat.raw_total)}</td><td class="num">100.00%</td></tr>
    </tbody>
  </table>`;
}

function verTableHTML(view, group){
  const m = ["最大值","最小值","平均值"];
  const cell = (metric, col) => {
    const key = col + "_" + (metric === "最大值" ? "max" : metric === "最小值" ? "min" : "avg");
    return view[key];
  };
  return `<div class="card">
    <h2>${group.title}</h2>
    <table>
      <colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup>
      <thead><tr><th>指标</th><th class="num">Ascan</th><th class="num">Dscan</th><th class="num">Total</th></tr></thead>
      <tbody>
        ${m.map(metric => `<tr><td>${metric}(天)</td><td class="num">${cell(metric,"Ascan")}</td><td class="num">${cell(metric,"Dscan")}</td><td class="num">${cell(metric,"Total")}</td></tr>`).join("")}
        <tr><td>24小时揽收率</td><td class="num">${view.rate24}</td><td class="num">—</td><td class="num">—</td></tr>
        <tr><td>准时签收率</td><td class="num">${view.rateOntime}</td><td class="num">—</td><td class="num">—</td></tr>
      </tbody>
    </table>
  </div>`;
}

function render(){
  const f = getFilters();
  const rows = ALL_ROWS.filter(r => matches(r, f));
  const result = document.getElementById("result");
  const meta = document.getElementById("meta");

  const labels = [];
  if(f.week) labels.push(`周：${WEEK_MAP[f.week] || f.week}`);
  if(f.provider) labels.push(`物流商：${f.provider}`);
  if(f.warehouse) labels.push(`仓库：${WAREHOUSE_NAME[f.warehouse] || f.warehouse}`);
  if(f.shift) labels.push(`班次：${SHIFT_NAME[f.shift] || f.shift}`);
  meta.innerHTML = `当前条件：<strong>${labels.length ? labels.join("、") : "全部"}</strong>　·　命中 <strong>${rows.length}</strong> 条记录`;

  if(rows.length === 0){
    result.innerHTML = `<div class="empty">当前筛选条件下暂无数据</div>`;
    return;
  }

  const stat = aggregate(rows);
  const views = {};
  VER_GROUPS.forEach(g => {
    views[g.key] = buildView(stat.buckets[g.prefix + "_" + g.sample]);
  });

  result.innerHTML = `
    <div class="card">
      <h2>基础指标汇总</h2>
      ${baseTableHTML(stat)}
    </div>
    <div class="ver-grid">
      ${VER_GROUPS.map(g => verTableHTML(views[g.key], g)).join("")}
    </div>`;
}

/* ================= 初始化 ================= */
async function init(){
  try{
    const resp = await fetch(DATA_URL + "?t=" + Date.now());
    if(!resp.ok) throw new Error("JSON 加载失败：" + resp.status);
    ALL_ROWS = await resp.json();
  }catch(err){
    document.getElementById("result").innerHTML =
      `<div class="empty">无法读取 ${DATA_URL}：${err.message}<br>请通过本地静态服务打开（python -m http.server 8000），不要用 file:// 双击。</div>`;
    return;
  }

  // 由数据动态建立 周id → 周标签 映射（标签优先取 week_label，兜底 week_range）
  WEEK_MAP = {};
  ALL_ROWS.forEach(r => {
    if(r.week_id != null && WEEK_MAP[r.week_id] == null){
      WEEK_MAP[r.week_id] = r.week_label || r.week_range || r.week_id;
    }
  });

  fillSelect(document.getElementById("selWeek"), uniqueSorted(ALL_ROWS,"week_id"),
    v => WEEK_MAP[v] || v, "全部周");
  fillSelect(document.getElementById("selProvider"), uniqueSorted(ALL_ROWS,"provider"), v => v, "全部物流商");
  fillSelect(document.getElementById("selWarehouse"), uniqueSorted(ALL_ROWS,"warehouse"),
    v => WAREHOUSE_NAME[v] || v, "全部仓库");
  fillSelect(document.getElementById("selShift"), uniqueSorted(ALL_ROWS,"shift"),
    v => SHIFT_NAME[v] || v, "全部班次");

  ["selWeek","selProvider","selWarehouse","selShift"].forEach(id =>
    document.getElementById(id).addEventListener("change", render));

  // 重置：清空全部筛选后刷新
  document.getElementById("btnReset").addEventListener("click", () => {
    ["selWeek","selProvider","selWarehouse","selShift"].forEach(id => document.getElementById(id).value = "");
    render();
  });
  // 查询：按当前下拉条件刷新
  document.getElementById("btnQuery").addEventListener("click", render);

  render();
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
