<div id="warehouseMenuRoot"></div>
<script>
// ==========【这里是唯一需要你维护的配置，新增月份只改这里！】==========
// 1. 仓库清单
const warehouseList = [
  {id:"wareA", name:"A仓"},
  {id:"wareM", name:"M仓"},
  {id:"wareB", name:"B仓"},
  {id:"wareO", name:"O仓"},
  {id:"wareF", name:"F仓"},
];
// 2. 月份清单【👉新增月份，在这里加一行就够！】
const monthList = [
  {name:"7月", folder:"warehouse_report_july"},
  {name:"8月", folder:"warehouse_report_august"},
  {name:"9月", folder:"warehouse_report_september"},
  {name:"10月", folder:"warehouse_report_october"},
];
// =================================================================

// 自动渲染函数
function renderWarehouseMenu(){
  let html = "";
  // 外层总菜单入口
  html += `<div class="item" onclick="toggleMenu('menuwarehouse')">🏬 各英仓报表 British warehouses_report</div>`;
  html += `<div class="submenu" id="menuwarehouse">`;

  // 循环遍历每一个仓库
  warehouseList.forEach(ware=>{
    const wareMenuId = `menu_${ware.id}`;
    html += `<div class="item" onclick="toggleMenu('${wareMenuId}')">📦 ${ware.name}</div>`;
    html += `<div class="submenu" id="${wareMenuId}">`;
    // 循环遍历所有月份，自动生成a链接
    monthList.forEach(m=>{
      // 链接路径，按你实际文件路径修改
      const linkUrl = `${m.folder}/${ware.id}_${m.folder}.html`;
      html += `<a class="sub-item" href="${linkUrl}" target="_blank">${m.name}</a>`;
    })
    html += `</div>`;
  })
  html += `</div>`;

  // 输出到页面容器
  document.getElementById("warehouseMenuRoot").innerHTML = html;
}

// 加载完立刻渲染菜单
renderWarehouseMenu();
</script>
